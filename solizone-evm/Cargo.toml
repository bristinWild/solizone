[package]
name = "solizone-evm"
version = "0.1.0"
edition = "2024"

[features]
# The Logos Zone SDK (publishing to and reading from a Logos channel). It pulls
# in the Logos node crates, including RocksDB, so hosts that only need the EVM
# node (compile, deploy, call) can build with `default-features = false`.
default = ["logos"]
logos = [
    "dep:lb-zone-sdk",
    "dep:lb-key-management-system-service",
    "dep:lb-groth16",
]

[[bin]]
name = "publish"
path = "src/bin/publish.rs"
required-features = ["logos"]

[[bin]]
name = "solizone_node"
path = "src/bin/solizone_node.rs"
required-features = ["logos"]

[dependencies]
# Logos Zone SDK pinned to the exact upstream commit of the Logos node it talks
# to (node 0.3.2, commit 198e378; check with `curl <node>/version`). The SDK must
# match the Logos node version it talks to: a different commit can fail to parse
# the node's blocks ("did not match any variant of untagged enum OpDe").
lb-zone-sdk = { package = "logos-blockchain-zone-sdk", git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "2c652646d", optional = true }
lb-key-management-system-service = { package = "logos-blockchain-key-management-system-service", git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "2c652646d", optional = true }
lb-groth16 = { package = "logos-blockchain-groth16", git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "2c652646d", optional = true }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4.3"
revm = "43.0.2"
revm-bytecode = "43.0.0"
serde = { version = "1", features = ["derive"] }

# Ethereum transaction decoding, signature recovery and JSON-RPC types
alloy-consensus = { version = "2.5.0", features = ["k256", "serde"] }
alloy-eips = "2.5.0"
alloy-rpc-types-eth = "2.5.0"
alloy-primitives = "1.7.3"
jsonrpsee = { version = "0.26.1", features = ["server", "macros"] }
# storage-bindings = { git = "https://github.com/logos-storage/storage-rust-bindings", rev = "71aa3fe896c0dae5bd587964e6b4943cdb1245f0" }

[dev-dependencies]
alloy-signer = "2.5.0"
alloy-signer-local = "2.5.0"
jsonrpsee = { version = "0.26.1", features = ["http-client"] }
